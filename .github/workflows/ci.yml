name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Check Go formatting
        run: test -z "$(gofmt -l plugin.go plugin_test.go)"

      - name: Check whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Check browser JavaScript syntax
        run: node --check ui/main.js

      - name: Test browser integration
        run: node --test webtest/main.test.mjs

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan for Go vulnerabilities
        run: govulncheck ./...
